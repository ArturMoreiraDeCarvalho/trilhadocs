[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trilhadocs"
version = "0.1.0"
description = "CLI local para validar inventários contábeis e gerar pacotes ZIP verificáveis"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["accounting", "cli", "data integrity", "privacy", "synthetic data"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
trilhadocs = "trilhadocs.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
